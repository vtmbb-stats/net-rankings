[build]
  publish = "."
  # Skip the deploy unless something the site serves changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- '*.html' '*.csv' '*.json'"

[[headers]]
  for = "/*.csv"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
