name: Update NET Rankings

on:
  schedule:
    # NCAA posts the NET in the morning. Two runs a day (approx. 9 AM and 3 PM ET);
    # nothing is committed when the rankings haven't changed.
    - cron: "0 14 * * *"
    - cron: "18 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-net-rankings
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Scrape NET rankings and rebuild data files
        run: python scrape_net_rankings.py

      - name: Commit and push if rankings changed
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add net_rankings_data.csv net_rankings_daily.csv net_ranks_by_season.json net_meta.json
          # Ignore runs where only the "last checked" timestamp moved.
          if git diff --staged --quiet -- net_rankings_data.csv net_rankings_daily.csv net_ranks_by_season.json; then
            echo "No ranking changes; nothing to commit."
            exit 0
          fi
          git commit -m "Update NET rankings data - $(TZ=America/New_York date +'%Y-%m-%d')"
          git push
