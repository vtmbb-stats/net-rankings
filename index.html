<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NET Rankings Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #333; margin-bottom: 5px; font-size: 28px; }
    .subtitle { color: #666; font-size: 14px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e9ecef;
    }
    .last-update { color: #6c757d; font-size: 13px; text-align: right; line-height: 1.6; }
    .last-update span { font-weight: 600; color: #495057; }

    .notice {
      background: #fff8e1;
      border: 1px solid #ffe08a;
      color: #6b5200;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .control-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
    .control-group > * { min-width: 0; }
    label { font-weight: 500; color: #555; }
    select, input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 14px;
      background: white;
      color: #333;
    }
    input[type="text"] { width: 250px; max-width: 100%; }
    input[type="text"]:focus { outline: none; border-color: #0d6efd; }
    .autocomplete-wrapper { position: relative; display: inline-block; }
    .autocomplete-items {
      position: absolute;
      border: 1px solid #dee2e6;
      border-top: none;
      z-index: 99;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 300px;
      overflow-y: auto;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #dee2e6; }
    .autocomplete-items div:hover { background-color: #f8f9fa; }

    .button-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #dee2e6;
      background: white;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { background: #f8f9fa; border-color: #adb5bd; }
    .filter-btn.active { background: #0d6efd; color: white; border-color: #0d6efd; }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: #555; margin: 10px 0; align-items: center; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.1); }
    .count { margin-left: auto; color: #6c757d; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th {
      background: #f8f9fa;
      padding: 10px 8px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 2px solid #dee2e6;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      text-align: center;
    }
    th:first-child, td:first-child { text-align: left; }
    th:hover { background: #eef1f4; }
    th.sortable:after { content: ' ⇅'; opacity: 0.3; }
    th.sort-asc:after { content: ' ↑'; opacity: 1; }
    th.sort-desc:after { content: ' ↓'; opacity: 1; }
    td { padding: 9px 8px; border-bottom: 1px solid #dee2e6; text-align: center; white-space: nowrap; }
    tr:hover { background: #f8f9fa; }
    tr.clickable { cursor: pointer; }

    .rank-top150 { background: #ffcccc; }
    .rank-mid { background: #fff4cc; }
    .rank-bottom { background: #ccffcc; }
    .rank-very-bottom { background: #4cc44c; }
    .rank-none { color: #adb5bd; font-style: italic; }

    #chart-container { display: none; margin-top: 40px; }
    .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .chart-empty { color: #6c757d; font-style: italic; }

    @media (max-width: 640px) {
      body { padding: 0; }
      .container { padding: 16px; border-radius: 0; }
      h1 { font-size: 22px; }
      .last-update { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Virginia Tech Men's Basketball NET Rankings Dashboard</h1>
        <p class="subtitle" id="subtitle">Loading…</p>
      </div>
      <div class="last-update">
        <div>NET through games: <span id="through-games">-</span></div>
        <div>Last checked: <span id="last-checked">-</span></div>
      </div>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="controls">
      <div class="control-group">
        <label>Filter:</label>
        <div class="button-group">
          <button class="filter-btn active" data-filter="all">All Teams</button>
          <button class="filter-btn" data-filter="Power 5">Power 5</button>
          <button class="filter-btn" data-filter="Mid-Major">Mid-Major</button>
          <button class="filter-btn" data-filter="Mid-Major Play">Mid-Major Play</button>
          <button class="filter-btn" data-filter="Mid-Major Consider">Mid-Major Consider</button>
          <button class="filter-btn" data-filter="Mid-Major Avoid">Mid-Major Avoid</button>
        </div>
      </div>

      <div class="control-group">
        <label for="search">Search:</label>
        <div class="autocomplete-wrapper">
          <input type="text" id="search" placeholder="Search team names..." autocomplete="off">
          <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
      </div>
    </div>

    <div class="legend">
      <span><i class="swatch rank-top150"></i>1–150</span>
      <span><i class="swatch rank-mid"></i>151–200</span>
      <span><i class="swatch rank-bottom"></i>201–260</span>
      <span><i class="swatch rank-very-bottom"></i>261+</span>
      <span class="count" id="row-count"></span>
    </div>

    <div class="table-wrap">
      <table id="rankings-table">
        <thead><tr id="table-head"></tr></thead>
        <tbody id="rankings-body"></tbody>
      </table>
    </div>

    <div id="chart-container">
      <div class="chart-head">
        <h2 id="chart-title" style="color:#333;"></h2>
        <div class="control-group">
          <label for="chart-season">Season:</label>
          <select id="chart-season"></select>
        </div>
      </div>
      <p class="chart-empty" id="chart-empty" hidden></p>
      <canvas id="net-chart"></canvas>
    </div>
  </div>

  <script>
    let meta = null;
    let columns = [];
    let data = [];
    let filteredData = [];
    let currentSort = { column: 'Average 5 Year NET', ascending: true };
    let selectedTeam = null;
    let dailyHistory = [];
    let chartInstance = null;

    const searchInput = document.getElementById('search');
    const autocompleteList = document.getElementById('autocomplete-list');
    const seasonSelect = document.getElementById('chart-season');

    const seasonName = s => `${s - 1}-${String(s).slice(2)}`;
    const seasonForDate = ymd => {
      const [y, m] = ymd.split('-').map(Number);
      return m >= 8 ? y + 1 : y;
    };
    const teamName = row => row.Team || row['Display Name'] || '';

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function formatRank(value) {
      const num = parseFloat(value);
      return Number.isNaN(num) ? '-' : Math.round(num).toString();
    }

    function formatAverage(value) {
      const num = parseFloat(value);
      return Number.isNaN(num) ? '-' : num.toFixed(1);
    }

    function getRankColorClass(rank) {
      const r = parseInt(rank, 10);
      if (Number.isNaN(r)) return 'rank-none';
      if (r <= 150) return 'rank-top150';
      if (r <= 200) return 'rank-mid';
      if (r <= 260) return 'rank-bottom';
      return 'rank-very-bottom';
    }

    function parseLocalYMD(ymd) {
      const [y, m, d] = ymd.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    // Columns are built from net_meta.json so the table rolls forward each season.
    function buildColumns() {
      const seasons = meta.seasons;
      const current = meta.current_season;
      columns = [
        { key: 'Team', label: 'Team', type: 'text' },
        { key: 'Status', label: 'Status', type: 'text' },
        { key: 'Conference', label: 'Conf', type: 'text' },
      ];
      if (meta.current_live) {
        columns.push({ key: 'Record', label: 'Record', type: 'text' });
        columns.push({ key: 'Quad 1', label: 'Quad 1', type: 'text' });
      }
      seasons.forEach(s => {
        columns.push({
          key: `NET ${s}`,
          label: s === current ? `${s} NET` : `${s} Final`,
          type: 'rank',
        });
      });
      columns.push({ key: 'Average 5 Year NET', label: '5-Year Average', type: 'avg' });

      const head = document.getElementById('table-head');
      head.innerHTML = '';
      columns.forEach(col => {
        const th = document.createElement('th');
        th.className = 'sortable';
        th.dataset.sort = col.key;
        th.textContent = col.label;
        th.addEventListener('click', () => sortData(col.key));
        head.appendChild(th);
      });

      const first = seasons[0], last = seasons[seasons.length - 1];
      document.getElementById('subtitle').textContent =
        `Final NET ${seasonName(first)} through ${seasonName(last - 1)} plus the live ${seasonName(last)} NET • 5-year average covers ${first}–${last} • Updates automatically`;

      const notice = document.getElementById('notice');
      if (!meta.current_live) {
        notice.hidden = false;
        notice.textContent = `The ${seasonName(current)} NET hasn't been released yet, so the ${current} column is empty and the 5-year average uses the ${seasons.length - 1} completed seasons. It will fill in automatically once the NCAA publishes the first NET.`;
      } else {
        notice.hidden = true;
      }
    }

    function updateStats() {
      const through = meta.through_games ? parseLocalYMD(meta.through_games) : null;
      document.getElementById('through-games').textContent = through
        ? through.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
          (meta.current_live ? '' : ` (${seasonName(meta.page_season)} final)`)
        : 'unknown';
      const checked = meta.scraped_at ? new Date(meta.scraped_at) : null;
      document.getElementById('last-checked').textContent = checked
        ? checked.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
        : '-';
    }

    function renderTable() {
      const tbody = document.getElementById('rankings-body');
      const html = filteredData.map(row => {
        const cells = columns.map(col => {
          const v = row[col.key];
          if (col.key === 'Team') return `<td><strong>${escapeHtml(v)}</strong></td>`;
          if (col.type === 'rank') {
            const r = formatRank(v);
            return `<td class="${getRankColorClass(r)}">${r}</td>`;
          }
          if (col.type === 'avg') return `<td><strong>${formatAverage(v)}</strong></td>`;
          return `<td>${escapeHtml(v || '-')}</td>`;
        }).join('');
        return `<tr class="clickable" data-team="${escapeHtml(row.Team)}">${cells}</tr>`;
      }).join('');
      tbody.innerHTML = html || `<tr><td colspan="${columns.length}" style="text-align:center; padding:40px;">No teams match.</td></tr>`;
      document.getElementById('row-count').textContent = `${filteredData.length} teams`;
    }

    function updateSortIndicators() {
      document.querySelectorAll('#table-head th').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        if (th.dataset.sort === currentSort.column) {
          th.classList.add(currentSort.ascending ? 'sort-asc' : 'sort-desc');
        }
      });
    }

    function applySortWithoutToggle() {
      const column = currentSort.column;
      filteredData.sort((a, b) => {
        const aVal = a[column], bVal = b[column];
        const aEmpty = aVal === null || aVal === undefined || aVal === '';
        const bEmpty = bVal === null || bVal === undefined || bVal === '';
        if (aEmpty && bEmpty) return 0;
        if (aEmpty) return 1;   // blanks always last
        if (bEmpty) return -1;

        const aNum = Number(aVal), bNum = Number(bVal);
        if (!Number.isNaN(aNum) && !Number.isNaN(bNum)) {
          return currentSort.ascending ? (aNum - bNum) : (bNum - aNum);
        }
        return currentSort.ascending ? String(aVal).localeCompare(String(bVal)) : String(bVal).localeCompare(String(aVal));
      });
      updateSortIndicators();
      renderTable();
    }

    function sortData(column) {
      if (currentSort.column === column) currentSort.ascending = !currentSort.ascending;
      else { currentSort.column = column; currentSort.ascending = true; }
      applySortWithoutToggle();
    }

    function statusMatches(row, statusFilter) {
      if (statusFilter === 'all') return true;
      if (statusFilter === 'Mid-Major') return (row.Status || '').startsWith('Mid-Major');
      return row.Status === statusFilter;
    }

    function activeFilter() {
      const btn = document.querySelector('.filter-btn.active');
      return btn ? btn.dataset.filter : 'all';
    }

    function filterData() {
      filteredData = selectedTeam ? [selectedTeam] : data.filter(row => statusMatches(row, activeFilter()));
      applySortWithoutToggle();
    }

    function hideChart() {
      document.getElementById('chart-container').style.display = 'none';
      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    }

    function showChart(name) {
      const teamData = dailyHistory.filter(d => d.team === name);
      const seasons = [...new Set(teamData.map(d => d.season))].sort((a, b) => b - a);

      document.getElementById('chart-container').style.display = 'block';
      seasonSelect.innerHTML = seasons.map(s => `<option value="${s}">${seasonName(s)}</option>`).join('');
      seasonSelect.parentElement.style.display = seasons.length > 1 ? '' : 'none';

      if (!seasons.length) {
        document.getElementById('chart-title').textContent = `${name} - Daily NET Ranking`;
        const empty = document.getElementById('chart-empty');
        empty.hidden = false;
        empty.textContent = 'No daily NET history for this team yet.';
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        return;
      }
      drawChart(name, seasons[0]);
    }

    function drawChart(name, season) {
      document.getElementById('chart-empty').hidden = true;
      seasonSelect.value = String(season);
      const teamData = dailyHistory
        .filter(d => d.team === name && d.season === season)
        .sort((a, b) => parseLocalYMD(a.date) - parseLocalYMD(b.date));

      document.getElementById('chart-title').textContent = `${name} - Daily NET Ranking (${seasonName(season)})`;
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(document.getElementById('net-chart').getContext('2d'), {
        type: 'line',
        data: {
          labels: teamData.map(d => parseLocalYMD(d.date).toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' })),
          datasets: [{
            label: 'NET Rank',
            data: teamData.map(d => d.rank),
            borderColor: '#0d6efd',
            backgroundColor: 'rgba(13, 110, 253, 0.1)',
            borderWidth: 2,
            tension: 0.1,
            pointRadius: 3,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          aspectRatio: 2.5,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: ctx => parseLocalYMD(teamData[ctx[0].dataIndex].date)
                  .toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
                label: ctx => 'NET Rank: ' + ctx.parsed.y
              }
            }
          },
          scales: {
            y: { reverse: true, title: { display: true, text: 'NET Rank' }, grid: { color: '#dee2e6' } },
            x: { title: { display: true, text: 'Date' }, grid: { color: '#dee2e6' } }
          }
        }
      });
    }

    // CSV parser that handles quoted commas
    function splitCSVLine(line) {
      const out = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === ',' && !inQ) { out.push(cur); cur = ''; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(s => s.replace(/\r/g, '').trim());
    }

    function parseCSV(csv) {
      const lines = csv.trim().split('\n').filter(l => l.trim());
      const headers = splitCSVLine(lines[0]);
      return lines.slice(1).map(line => {
        const values = splitCSVLine(line);
        const row = {};
        headers.forEach((h, i) => row[h] = values[i] ?? '');
        return row;
      });
    }

    function selectTeam(team) {
      selectedTeam = team;
      searchInput.value = teamName(team);
      autocompleteList.innerHTML = '';
      filterData();
      showChart(teamName(team));
    }

    async function loadData() {
      try {
        const [metaRes, dataRes] = await Promise.all([
          fetch('net_meta.json', { cache: 'no-cache' }),
          fetch('net_rankings_data.csv', { cache: 'no-cache' }),
        ]);
        if (!metaRes.ok || !dataRes.ok) throw new Error('data files missing');
        meta = await metaRes.json();
        data = parseCSV(await dataRes.text());
        buildColumns();
        updateStats();
        filterData();
        // Deep link: index.html?team=Virginia%20Tech opens that team's chart
        const linked = new URLSearchParams(location.search).get('team');
        const match = linked && data.find(r => r.Team.toLowerCase() === linked.toLowerCase());
        if (match) selectTeam(match);
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('rankings-body').innerHTML =
          '<tr><td style="text-align:center; padding:40px;">Error loading data.</td></tr>';
      }
    }

    async function loadDaily() {
      try {
        const text = await (await fetch('net_rankings_daily.csv', { cache: 'no-cache' })).text();
        dailyHistory = [];
        for (const line of text.trim().split('\n').slice(1)) {
          if (!line.trim()) continue;
          const [date, team, rank] = splitCSVLine(line);
          const rnk = parseInt(rank, 10);
          if (!date || !team || Number.isNaN(rnk)) continue;
          dailyHistory.push({ date, team, rank: rnk, season: seasonForDate(date) });
        }
        if (selectedTeam) showChart(teamName(selectedTeam));
      } catch (err) {
        console.error('Error loading daily history:', err);
      }
    }

    // Event listeners
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Default sort per filter: Play/Consider show the worst 5-year average first,
        // everything else shows the best first. Column headers can still re-sort.
        currentSort = {
          column: 'Average 5 Year NET',
          ascending: !['Mid-Major Play', 'Mid-Major Consider'].includes(btn.dataset.filter),
        };
        selectedTeam = null;
        searchInput.value = '';
        hideChart();
        filterData();
      });
    });

    document.getElementById('rankings-body').addEventListener('click', e => {
      const tr = e.target.closest('tr[data-team]');
      if (!tr) return;
      const team = data.find(r => r.Team === tr.dataset.team);
      if (team) selectTeam(team);
    });

    seasonSelect.addEventListener('change', () => {
      if (selectedTeam) drawChart(teamName(selectedTeam), Number(seasonSelect.value));
    });

    searchInput.addEventListener('input', function() {
      const term = this.value.toLowerCase();
      autocompleteList.innerHTML = '';
      if (!term) {
        selectedTeam = null;
        filterData();
        hideChart();
        return;
      }
      const statusFilter = activeFilter();
      data.filter(row => statusMatches(row, statusFilter) && teamName(row).toLowerCase().includes(term))
        .slice(0, 10)
        .forEach(team => {
          const div = document.createElement('div');
          div.textContent = teamName(team);
          div.addEventListener('click', () => selectTeam(team));
          autocompleteList.appendChild(div);
        });
    });

    document.addEventListener('click', e => {
      if (e.target !== searchInput) autocompleteList.innerHTML = '';
    });

    loadData();
    loadDaily();
  </script>
</body>
</html>
